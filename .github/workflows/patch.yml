name: Patch NickAPI pour Paper 26.2

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilation de NickPlugin.java (patché) uniquement
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          mvn -B -ntp clean compile 2>&1 | tee build.log

      - name: Publication du log en cas d'échec (diagnostic)
        if: steps.build.outcome == 'failure'
        run: |
          mkdir -p build-logs
          cp build.log "build-logs/${{ github.run_id }}.log"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "ci-logs/${{ github.run_id }}"
          git rm -rf --cached . > /dev/null 2>&1 || true
          git add "build-logs/${{ github.run_id }}.log"
          git commit -q -m "CI log run ${{ github.run_id }}"
          git push origin "HEAD:refs/heads/ci-logs/${{ github.run_id }}"

      - name: Échec si la compilation a échoué
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Injection de la classe patchée dans une copie du jar original
        run: |
          set -e
          mkdir -p output
          cp original-jar/NickAPI-7.11-original.jar output/NickAPI-7.11-paper26.jar
          # jar update: remplace uniquement xyz/haoshoku/nick/NickPlugin.class,
          # tout le reste du jar (handlers NMS, httpclient5, etc.) reste inchangé.
          cd target/classes
          jar uf ../../output/NickAPI-7.11-paper26.jar xyz/haoshoku/nick/NickPlugin.class
          cd ../..
          echo "Contenu vérifié :"
          unzip -p output/NickAPI-7.11-paper26.jar xyz/haoshoku/nick/NickPlugin.class | wc -c

      - name: Upload de l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: NickAPI-7.11-paper26-patched
          path: output/NickAPI-7.11-paper26.jar
          if-no-files-found: error
