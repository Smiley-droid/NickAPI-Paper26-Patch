name: Patch NickAPI pour Paper 26.2

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilation de NickPlugin.java (patché) uniquement
        run: mvn -B -ntp clean compile

      - name: Injection de la classe patchée dans une copie du jar original
        run: |
          set -e
          mkdir -p output
          cp original-jar/NickAPI-7.11-original.jar output/NickAPI-7.11-paper26.jar
          # jar update: remplace uniquement xyz/haoshoku/nick/NickPlugin.class,
          # tout le reste du jar (handlers NMS, httpclient5, etc.) reste inchangé.
          cd target/classes
          jar uf ../../output/NickAPI-7.11-paper26.jar xyz/haoshoku/nick/NickPlugin.class
          cd ../..
          echo "Contenu vérifié :"
          unzip -p output/NickAPI-7.11-paper26.jar xyz/haoshoku/nick/NickPlugin.class | wc -c

      - name: Upload de l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: NickAPI-7.11-paper26-patched
          path: output/NickAPI-7.11-paper26.jar
          if-no-files-found: error
