name: Inspecter ClientboundPlayerInfoUpdatePacket sur Paper 26.2

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Téléchargement du jar officiel Paper 26.2 build 112
        run: |
          set -e
          URL=$(curl -s -H "User-Agent: nickapi-patch-inspector" \
            https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/112 \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['downloads']['server:default']['url'])")
          echo "Download URL: $URL"
          curl -s -L -o paper-26.2-112.jar "$URL"
          ls -la paper-26.2-112.jar

      - name: Génération du jar patché (premier démarrage paperclip)
        run: |
          set -e
          mkdir -p rundir
          cp paper-26.2-112.jar rundir/
          cd rundir
          echo "eula=true" > eula.txt
          # Le paperclip télécharge + patche le jar Mojang au premier lancement,
          # puis démarre le serveur. On le laisse patcher, puis on l'arrête.
          (echo "stop"; sleep 120; ) | timeout 180 java -jar paper-26.2-112.jar --nogui || true
          echo "--- Contenu de cache/ ---"
          find cache -type f 2>/dev/null
          echo "--- Contenu de versions/ ---"
          find versions -type f 2>/dev/null

      - name: Extraction des classes du paquet
        id: extract
        continue-on-error: true
        run: |
          set -o pipefail
          {
          echo "--- find rundir (tout) ---"
          find rundir -maxdepth 4 -type d
          echo "--- tous les .jar sous rundir ---"
          find rundir -type f -name "*.jar"
          PATCHED_JAR=$(find rundir/cache rundir/versions -type f -name "*.jar" 2>/dev/null | while read -r f; do
            echo "$(jar tf "$f" 2>/dev/null | wc -l) $f"
          done | sort -n -r | head -1 | awk '{print $2}')
          echo "Jar patché détecté : $PATCHED_JAR"
          if [ -z "$PATCHED_JAR" ]; then
            echo "Aucun jar patché trouvé !"
            exit 0
          fi
          echo "--- Nombre total d'entrees ---"
          jar tf "$PATCHED_JAR" | wc -l
          mkdir -p extracted
          cd extracted
          for CLASS in \
            net/minecraft/network/protocol/game/ClientboundPlayerInfoUpdatePacket \
            net/minecraft/network/protocol/game/ClientboundPlayerInfoRemovePacket \
            net/minecraft/network/protocol/game/ClientboundPlayerChatPacket \
            net/minecraft/network/protocol/game/ClientboundSystemChatPacket \
            net/minecraft/network/protocol/game/ClientboundBundlePacket \
            net/minecraft/network/protocol/game/ClientboundAddEntityPacket \
            net/minecraft/network/protocol/game/ClientGamePacketListener \
            net/minecraft/network/Connection \
            net/minecraft/network/NetworkManager \
            net/minecraft/network/protocol/BundlePacket \
            net/minecraft/network/chat/ChatType \
            net/minecraft/network/chat/SignedMessageBody \
            net/minecraft/server/network/ServerGamePacketListenerImpl \
            net/minecraft/server/network/ServerCommonPacketListenerImpl \
            net/minecraft/server/network/PlayerConnection \
            net/minecraft/server/level/ServerPlayer \
            net/minecraft/server/players/PlayerList \
            net/minecraft/server/dedicated/DedicatedPlayerList \
            net/minecraft/network/chat/RemoteChatSession \
            net/minecraft/network/chat/Component \
            org/bukkit/craftbukkit/CraftServer \
            org/bukkit/craftbukkit/entity/CraftPlayer \
          ; do
            jar xf "../$PATCHED_JAR" "$CLASS.class" 2>/dev/null && echo "OK: $CLASS" || echo "absent: $CLASS"
          done
          # egalement toutes les classes internes (nested, $...) de ces familles
          cd ../
          jar tf "$PATCHED_JAR" | grep -E "network/protocol/(BundlePacket|game/ClientboundPlayerInfoUpdatePacket|game/ClientboundPlayerInfoRemovePacket|game/ClientboundPlayerChatPacket|game/ClientboundSystemChatPacket|game/ClientboundBundlePacket|game/ClientboundAddEntityPacket)\\\$" > nested-list.txt || true
          jar tf "$PATCHED_JAR" | grep -E "network/chat/(ChatType|SignedMessageBody)\\\$" >> nested-list.txt || true
          jar tf "$PATCHED_JAR" | grep -E "network/(Connection|NetworkManager)\\\$" >> nested-list.txt || true
          jar tf "$PATCHED_JAR" | grep -E "server/network/(ServerGamePacketListenerImpl|ServerCommonPacketListenerImpl|PlayerConnection)\\\$" >> nested-list.txt || true
          jar tf "$PATCHED_JAR" | grep -E "server/level/ServerPlayer\\\$" >> nested-list.txt || true
          cat nested-list.txt
          cd extracted
          while read -r entry; do
            jar xf "../$PATCHED_JAR" "$entry" || true
          done < ../nested-list.txt
          find . -type f
          } 2>&1 | tee extract.log

      - name: Publication du log d'extraction (diagnostic)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "extract-log/${{ github.run_id }}"
          git rm -rf --cached . > /dev/null 2>&1 || true
          mkdir -p log-output
          cp extract.log log-output/ 2>/dev/null || true
          git add log-output
          git commit -q -m "Log extraction run ${{ github.run_id }}" || echo "rien a committer"
          git push origin "HEAD:refs/heads/extract-log/${{ github.run_id }}" || echo "rien a push"

      - name: Téléchargement de Vineflower (décompilateur)
        run: |
          set -e
          ASSET_URL=$(curl -s https://api.github.com/repos/Vineflower/vineflower/releases/latest \
            | python3 -c "import json,sys; d=json.load(sys.stdin); a=[x for x in d['assets'] if x['name'].endswith('.jar') and 'slim' not in x['name']]; print(a[0]['browser_download_url'])")
          echo "Asset URL: $ASSET_URL"
          curl -s -L -o vineflower.jar "$ASSET_URL"
          file vineflower.jar
          ls -la vineflower.jar

      - name: Décompilation
        id: decompile
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p decompiled
          if [ -z "$(find extracted -type f)" ]; then
            echo "Aucun fichier extrait, on saute la decompilation." | tee decompile.log
          else
            java -jar vineflower.jar extracted decompiled 2>&1 | tee decompile.log
          fi
          find decompiled -type f

      - name: Publication du log en cas d'échec
        if: steps.decompile.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "decompile-log/${{ github.run_id }}"
          git rm -rf --cached . > /dev/null 2>&1 || true
          mkdir -p log-output
          cp decompile.log log-output/ 2>/dev/null || true
          find extracted -type f > log-output/extracted-files.txt
          git add log-output
          git commit -q -m "Log decompile run ${{ github.run_id }}"
          git push origin "HEAD:refs/heads/decompile-log/${{ github.run_id }}"

      - name: Échec si la décompilation a échoué
        if: steps.decompile.outcome == 'failure'
        run: exit 1

      - name: Publication sur une branche dédiée
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "packet-inspect/${{ github.run_id }}"
          git rm -rf --cached . > /dev/null 2>&1 || true
          mkdir -p inspect-output
          cp -r decompiled/* inspect-output/ 2>/dev/null || true
          cp nested-list.txt inspect-output/ 2>/dev/null || true
          git add inspect-output
          git commit -q -m "Inspection paquet run ${{ github.run_id }}"
          git push origin "HEAD:refs/heads/packet-inspect/${{ github.run_id }}"
