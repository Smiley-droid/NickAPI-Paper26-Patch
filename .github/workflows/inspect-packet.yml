name: Inspecter ClientboundPlayerInfoUpdatePacket sur Paper 26.2

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Téléchargement du jar officiel Paper 26.2 build 112
        run: |
          set -e
          URL=$(curl -s -H "User-Agent: nickapi-patch-inspector" \
            https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/112 \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['downloads']['server:default']['url'])")
          echo "Download URL: $URL"
          curl -s -L -o paper-26.2-112.jar "$URL"
          ls -la paper-26.2-112.jar

      - name: Extraction des classes du paquet
        run: |
          echo "--- Nombre total d'entrees dans le jar ---"
          jar tf paper-26.2-112.jar | wc -l
          echo "--- Racine du jar ---"
          jar tf paper-26.2-112.jar | awk -F/ '{print $1}' | sort -u | head -30
          echo "--- Contenu META-INF/versions (paperclip ?) ---"
          jar tf paper-26.2-112.jar | grep "META-INF/versions" | head -20
          mkdir -p extracted
          cd extracted
          jar xf ../paper-26.2-112.jar net/minecraft/network/protocol/game/ClientboundPlayerInfoUpdatePacket.class || true
          cd ../
          jar tf paper-26.2-112.jar | grep -i "PlayerInfo" > pkg-list.txt || true
          echo "--- PlayerInfo matches ---"
          cat pkg-list.txt
          jar tf paper-26.2-112.jar | grep "network/protocol/game/Clientbound" > all-clientbound-game.txt || true
          echo "--- total clientbound game packets ---"
          wc -l all-clientbound-game.txt
          cd extracted
          while read -r entry; do
            jar xf ../paper-26.2-112.jar "$entry" || true
          done < ../pkg-list.txt
          find . -type f

      - name: Téléchargement de Vineflower (décompilateur)
        run: |
          set -e
          ASSET_URL=$(curl -s https://api.github.com/repos/Vineflower/vineflower/releases/latest \
            | python3 -c "import json,sys; d=json.load(sys.stdin); a=[x for x in d['assets'] if x['name'].endswith('.jar') and 'slim' not in x['name']]; print(a[0]['browser_download_url'])")
          echo "Asset URL: $ASSET_URL"
          curl -s -L -o vineflower.jar "$ASSET_URL"
          file vineflower.jar
          ls -la vineflower.jar

      - name: Décompilation
        id: decompile
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p decompiled
          if [ -z "$(find extracted -type f)" ]; then
            echo "Aucun fichier extrait, on saute la decompilation." | tee decompile.log
          else
            java -jar vineflower.jar extracted decompiled 2>&1 | tee decompile.log
          fi
          find decompiled -type f

      - name: Publication du log en cas d'échec
        if: steps.decompile.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "decompile-log/${{ github.run_id }}"
          git rm -rf --cached . > /dev/null 2>&1 || true
          mkdir -p log-output
          cp decompile.log log-output/ 2>/dev/null || true
          find extracted -type f > log-output/extracted-files.txt
          git add log-output
          git commit -q -m "Log decompile run ${{ github.run_id }}"
          git push origin "HEAD:refs/heads/decompile-log/${{ github.run_id }}"

      - name: Échec si la décompilation a échoué
        if: steps.decompile.outcome == 'failure'
        run: exit 1

      - name: Publication sur une branche dédiée
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "packet-inspect/${{ github.run_id }}"
          git rm -rf --cached . > /dev/null 2>&1 || true
          mkdir -p inspect-output
          cp -r decompiled/* inspect-output/ 2>/dev/null || true
          cp pkg-list.txt inspect-output/ 2>/dev/null || true
          cp all-clientbound-game.txt inspect-output/ 2>/dev/null || true
          jar tf paper-26.2-112.jar > inspect-output/full-jar-listing.txt 2>/dev/null || true
          git add inspect-output
          git commit -q -m "Inspection paquet run ${{ github.run_id }}"
          git push origin "HEAD:refs/heads/packet-inspect/${{ github.run_id }}"
